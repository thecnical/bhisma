[metadata]
name = bhisma
version = 3.0.0
description = AI-Powered Autonomous Multi-Protocol Offensive WiFi Framework
long_description = file: README.md
long_description_content_type = text/markdown
author = Bhisma Team
author_email = team@bhisma.dev
url = https://github.com/thecnical/bhisma
license = MIT
license_files = LICENSE
keywords = wifi, security, pentesting, ai, autonomous, offensive-security
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Information Technology
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Security
    Topic :: System :: Networking
    Topic :: Utilities

[options]
packages = find:
python_requires = >=3.8
install_requires =
    click>=8.1.0
    rich>=13.0.0
    pydantic>=2.0.0
    pyyaml>=6.0
    httpx>=0.24.0
    fastapi>=0.100.0
    uvicorn>=0.23.0
    jinja2>=3.1.0
    websockets>=11.0
    questionary>=2.0.0
    scikit-learn>=1.3.0
    numpy>=1.24.0
    joblib>=1.3.0
    scapy>=2.5.0
    psutil>=5.9.0

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    black>=23.0.0
    flake8>=6.0.0
    isort>=5.12.0
    mypy>=1.5.0
    pre-commit>=3.3.0
    tox>=4.6.0
    bandit>=1.7.0

[options.entry_points]
console_scripts =
    bhisma = bhisma.cli.main:cli

[options.package_data]
bhisma =
    dashboard/templates/*.html
    dashboard/static/css/*.css
    dashboard/static/js/*.js
    dashboard/static/img/*.png
    dashboard/static/img/*.jpg

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,*.egg,venv,.venv
ignore = E203,W503

[isort]
profile = black
line_length = 100
