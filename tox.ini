[tox]
envlist = py38,py39,py310,py311,py312,flake8,mypy,security

[testenv]
deps =
    pytest>=7.4.0
    pytest-cov>=4.1.0
commands =
    pytest {posargs}

[testenv:flake8]
deps = flake8>=6.0.0
commands = flake8 bhisma/ tests/

[testenv:mypy]
deps =
    mypy>=1.5.0
    types-PyYAML
    types-requests
commands = mypy bhisma/

[testenv:security]
deps = bandit>=1.7.0
commands = bandit -r bhisma/ -f json -o bandit-report.json || true

[testenv:black]
deps = black>=23.0.0
commands = black --check bhisma/ tests/

[testenv:isort]
deps = isort>=5.12.0
commands = isort --check-only bhisma/ tests/

[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,*.egg,venv,.venv
ignore = E203,W503
